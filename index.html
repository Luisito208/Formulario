<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de usuarios</title>
    <link rel="stylesheet" href="style.css">
   </head>
<body>
    <div class="container">
        <h2> Crear usuario</h2>
        <form id="registro">
        <label>Nombre</label>
        <input
        type="text"
        id="nombre"
        maxlength="50"
        minlength="5"
        required>

        <label>Correo electrónico</label>
        <input
        type="email"
        id="correo"
        required>

        <label>Contraseña</label>
        <input
        type="password"
        id="password"
        minlength="7"
        required>

        <button type="submit">Registrar</button>

        </form>
        <p id="mensaje"></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
